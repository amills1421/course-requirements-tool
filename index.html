<!DOCTYPE html>
<html>
<head>
  <title>Course Requirements Lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      padding: 1rem;
      max-width: 1200px;
      margin: auto;
      background: #ffffff;
      color: #091d20;
    }
    h2 {
      text-align: center;
      color: #093c44;
    }
    h3 {
      text-align: center;
      color: #093c44;
      margin-top: 1rem;
    }
    label {
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #2f8d98;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    .control-button {
      padding: 0.6rem 1.5rem;
      background-color: #115e6e;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 1rem;
      transition: background-color 0.3s ease;
    }
    .control-button:hover {
      background-color: #093c44;
    }
    .course-button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem;
      margin: 0.25rem 0;
      background-color: #2f8d98;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .course-button:hover {
      background-color: #115e6e;
    }
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .widget-card {
      background-color: #ffffff;
      border: 2px solid #2f8d98;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      padding: 1rem;
      word-break: break-word;
    }
    .widget-card h4 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #115e6e;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
    }
    .widget-card h4 i {
      margin-right: 0.5rem;
      color: #093c44;
    }
    .no-results {
      color: #d9534f;
      font-weight: bold;
      margin-top: 1rem;
    }
    #loadingIndicator {
      text-align: center;
      color: #a84c2a;
      font-style: italic;
      margin-top: 1rem;
      display: none;
    }
    a {
      color: #a84c2a;
      text-decoration: underline;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <h2>Course Requirements Lookup</h2>
  <label for="courseInput">Start typing a course title:</label>
  <input type="text" id="courseInput" placeholder="e.g., Chemistry A" />

  <div id="buttonControls" style="margin-bottom: 1rem;">
    <button class="control-button" onclick="clearResults()">Clear</button>
    <button class="control-button" onclick="delayedPrint()">Print</button>
  </div>

  <div id="courseResults"></div>
  <div id="loadingIndicator">Searching...</div>
  <div id="outputBox"></div>

  <script>
    const API_URL = "https://script.google.com/a/macros/mivu.org/s/AKfycby-tCUKDQcIklm2cGDW2JpFp4WV9ZvqZHhsPLOaazmRd76h9-mHwTQ0n5AQaPfeB9xzsg/exec";
    let allTitles = [];

    async function fetchTitles() {
      try {
        const res = await fetch(API_URL + "?getTitles=true");
        allTitles = await res.json();
      } catch {
        console.error("Failed to fetch course titles.");
      }
    }

    function formatValue(val) {
      if (!val) return "—";
      let str = val.toString();

      // Markdown-style links [text](url)
      str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, (_, text, url) => {
        return `<a href="${url}" target="_blank">${text}</a>`;
      });

      // Bold-italic
      str = str.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      // Bold
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italic
      str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Line breaks
      str = str.replace(/\n/g, "<br>");

      // Auto-link plain URLs NOT inside anchor tags
      str = str.replace(/(^|[^">])(https?:\/\/[^\s<]+)/g, (_, before, url) => {
        return `${before}<a href="${url}" target="_blank">${url}</a>`;
      });

      return str;
    }
    function generateCard(label, icon, value, subvalue = "") {
      return `
        <div class="widget-card">
          <h4><i class="${icon}"></i> ${label}</h4>
          <p>${formatValue(value)}</p>
          ${subvalue ? `<p style="margin-top: 0.5rem;"><strong>Estimated Cost:</strong> ${formatValue(subvalue)}</p>` : ""}
        </div>
      `;
    }

    function displayCourse(course) {
      const output = document.getElementById('outputBox');
      const titleHeader = `<h3>${course.courseTitle || "Course Requirements"}</h3>`;
      output.innerHTML = titleHeader + `
        <div class="widget-grid">
          ${generateCard("Technical Requirements", "fas fa-laptop-code", course.technical)}
          ${generateCard("Device Restrictions", "fas fa-tablet-alt", course.device)}
          ${generateCard("Required Operating Systems", "fas fa-desktop", course.os)}
          ${generateCard("Software Downloads", "fas fa-download", course.software)}
          ${generateCard("Additional Hardware", "fas fa-microchip", course.hardware)}
          ${generateCard("Textbook / eText", "fas fa-book-open", course.textbook, course.cost)}
          ${generateCard("Additional Costs", "fas fa-coins", course.additionalCosts)}
        </div>
      `;
    }

    async function loadCourse(title) {
      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('outputBox').innerHTML = "";
      try {
        const res = await fetch(API_URL + "?course=" + encodeURIComponent(title));
        const data = await res.json();
        document.getElementById('loadingIndicator').style.display = 'none';
        if (data && data.length > 0) {
          displayCourse(data[0]);
        } else {
          document.getElementById('outputBox').innerHTML = "<div class='no-results'>No data found for that course.</div>";
        }
      } catch {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('outputBox').innerHTML = "<div class='no-results'>Error retrieving course data.</div>";
      }
    }

    function clearResults() {
      document.getElementById('courseInput').value = "";
      document.getElementById('courseResults').innerHTML = "";
      document.getElementById('outputBox').innerHTML = "";
      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('courseInput').focus();
    }

    function delayedPrint() {
      setTimeout(() => {
        window.print();
      }, 100);
    }

    document.getElementById('courseInput').addEventListener('input', () => {
      const query = document.getElementById('courseInput').value.toLowerCase().trim();
      const courseResults = document.getElementById('courseResults');
      courseResults.innerHTML = "";

      if (query.length < 2) return;

      const matches = allTitles.filter(t => t.toLowerCase().includes(query));
      matches.forEach(match => {
        const btn = document.createElement('button');
        btn.className = 'course-button';
        btn.textContent = match;
        btn.onclick = () => {
          document.getElementById('courseInput').value = match;
          loadCourse(match);
          courseResults.innerHTML = "";
        };
        courseResults.appendChild(btn);
      });
    });

    window.addEventListener('DOMContentLoaded', fetchTitles);
  </script>
</body>
</html>
