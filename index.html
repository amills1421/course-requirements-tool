<!DOCTYPE html>
<html>
<head>
  <title>Course Requirements Lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; padding: 1rem; max-width: 1200px; margin: auto; background: #fff; color: #091d20; }
    h2, h3 { text-align: center; color: #093c44; }
    input[type="text"] { width: 100%; padding: 0.75rem; font-size: 1rem; border: 2px solid #2f8d98; border-radius: 6px; margin-bottom: 1rem; }
    .control-button { padding: 0.6rem 1.5rem; background-color: #115e6e; color: white; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; margin-right: 1rem; }
    .control-button:hover { background-color: #093c44; }
    .course-button { display: block; width: 100%; text-align: left; padding: 0.5rem; margin: 0.25rem 0; background-color: #2f8d98; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .course-button:hover { background-color: #115e6e; }
    .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .widget-card { background: #fff; border: 2px solid #2f8d98; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 1rem; word-break: break-word; }
    .widget-card h4 { margin-top: 0; margin-bottom: 0.5rem; color: #115e6e; font-size: 1.1rem; display: flex; align-items: center; }
    .widget-card h4 i { margin-right: 0.5rem; color: #093c44; }
    #loadingIndicator { text-align: center; color: #a84c2a; font-style: italic; margin-top: 1rem; display: none; }
    a { color: #a84c2a; text-decoration: underline; word-break: break-word; }
  </style>
</head>
<body>
  <h2>Course Requirements Lookup</h2>
  <label for="courseInput">Start typing a course title:</label>
  <input type="text" id="courseInput" placeholder="e.g., Chemistry A" />
  <div id="buttonControls" style="margin-bottom: 1rem;">
    <button class="control-button" onclick="clearResults()">Clear</button>
    <button class="control-button" onclick="delayedPrint()">Print</button>
  </div>
  <div id="courseResults"></div>
  <div id="loadingIndicator">Searching...</div>
  <div id="outputBox"></div>
  <script>
    const API_URL = "https://script.google.com/a/macros/mivu.org/s/AKfycby-tCUKDQcIklm2cGDW2JpFp4WV9ZvqZHhsPLOaazmRd76h9-mHwTQ0n5AQaPfeB9xzsg/exec";
    let allTitles = [];

    async function fetchTitles() {
      try {
        const res = await fetch(API_URL + "?getTitles=true");
        allTitles = await res.json();
      } catch {
        console.error("Failed to fetch course titles.");
      }
    }

    function formatValue(val) {
      if (!val) return "—";
      let str = val.toString();
      str = str.replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, (_, text, url) => `<a href="${url}" target="_blank">${text}</a>`);
      str = str.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      str = str.replace(/\n/g, "<br>");
      str = str.replace(/(^|[^">])(https?:\/\/[^\s<]+)/g, (_, b, url) => `${b}<a href="${url}" target="_blank">${url}</a>`);
      return str;
    }

    function generateCard(label, icon, value) {
      const isList = typeof value === 'string' && value.includes('<li>');
      const body = isList ? `<ul style='padding-left: 1.25rem;'>${value}</ul>` : `<p>${formatValue(value)}</p>`;
      return `<div class="widget-card"><h4><i class="${icon}"></i> ${label}</h4>${body}</div>`;
    }
    function displayCourse(course) {
      const output = document.getElementById("outputBox");
      let titleHeader = `<h3>${course.courseTitle || "Course Requirements"}</h3>`;
      if (course.syllabus) {
        titleHeader += `<p style="text-align: center; margin-top: -0.5rem;"><a href="${course.syllabus}" target="_blank">View Syllabus</a></p>`;
      }
      if (course.resourcesFlag && course.resourcesFlag.toLowerCase() === "yes") {
        titleHeader += `<div style="background-color: #fff3cd; border: 1px solid #ffeeba; padding: 0.75rem; text-align: center; margin: 0.5rem 0; border-radius: 6px;">
          <i class="fas fa-flag" style="color: #a84c2a;"></i> <strong>Unique Resources / Materials Needed</strong></div>`;
      }

      output.innerHTML = titleHeader + `
        <div class="widget-grid">
          ${generateCard("Device and Technical Requirements", "fas fa-laptop-code", (course.technical || "").split(/,\s*/).map(i => `<li>${i}</li>`).join(""))}
          ${generateCard("Additional Hardware or Software", "fas fa-microchip", (course.hardwareSoftware || "").split(/,\s*/).map(i => `<li>${i}</li>`).join(""))}
          ${generateCard("Textbook / eText", "fas fa-book-open", course.textbook)}
          ${generateCard("Any Additional Costs", "fas fa-coins", course.costs)}
          ${generateCard("Any Additional Information", "fas fa-info-circle", course.additionalInfo)}
        </div>
      `;
    }

    function clearResults() {
      document.getElementById('courseInput').value = "";
      document.getElementById('courseResults').innerHTML = "";
      document.getElementById('outputBox').innerHTML = "";
      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('courseInput').focus();
    }

    function delayedPrint() {
      setTimeout(() => { window.print(); }, 100);
    }

    document.getElementById('courseInput').addEventListener('input', () => {
      const query = document.getElementById('courseInput').value.toLowerCase().trim();
      const courseResults = document.getElementById('courseResults');
      courseResults.innerHTML = "";
      if (query.length < 2) return;
      const matches = allTitles.filter(t => t.toLowerCase().includes(query));
      matches.forEach(match => {
        const btn = document.createElement('button');
        btn.className = 'course-button';
        btn.textContent = match;
        btn.onclick = () => {
          document.getElementById('courseInput').value = match;
          loadCourse(match);
          courseResults.innerHTML = "";
        };
        courseResults.appendChild(btn);
      });
    });

    async function loadCourse(title) {
      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('outputBox').innerHTML = "";
      try {
        const res = await fetch(API_URL + "?course=" + encodeURIComponent(title));
        const data = await res.json();
        document.getElementById('loadingIndicator').style.display = 'none';
        if (data && data.length > 0) {
          displayCourse(data[0]);
        } else {
          document.getElementById('outputBox').innerHTML = "<div class='no-results'>No data found for that course.</div>";
        }
      } catch {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('outputBox').innerHTML = "<div class='no-results'>Error retrieving course data.</div>";
      }
    }

    window.addEventListener('DOMContentLoaded', fetchTitles);
  </script>
</body>
</html>
