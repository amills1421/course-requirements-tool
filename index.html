<!DOCTYPE html>
<html>
<head>
  <title>Course Requirements Lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      padding: 1rem;
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      color: #091d20;
    }
    h2 {
      text-align: center;
      color: #093c44;
    }
    label {
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #2f8d98;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    .course-button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem;
      margin: 0.25rem 0;
      background-color: #2f8d98;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .course-button:hover {
      background-color: #115e6e;
    }
    .output-box {
      background-color: #f8f8f8;
      border: 1px solid #ccc;
      border-left: 6px solid #2f8d98;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 4px;
    }
    .output-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .output-item .label {
      min-width: 280px;
      font-weight: bold;
      color: #093c44;
    }
    .output-item i {
      margin-right: 8px;
      color: #115e6e;
      width: 20px;
    }
    .output-item .value {
      flex: 1;
    }
    .no-results {
      color: #d9534f;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h2>Course Requirements Lookup</h2>
  <label for="courseInput">Start typing a course title:</label>
  <input type="text" id="courseInput" placeholder="e.g., Chemistry A" />
  <div id="courseResults"></div>
  <div id="outputBox"></div>

  <script>
    const API_URL = "https://script.google.com/a/macros/mivu.org/s/AKfycby-tCUKDQcIklm2cGDW2JpFp4WV9ZvqZHhsPLOaazmRd76h9-mHwTQ0n5AQaPfeB9xzsg/exec";
    let allTitles = [];

    async function fetchTitles() {
      try {
        const res = await fetch(API_URL + "?getTitles=true");
        allTitles = await res.json();
      } catch {
        console.error("Failed to fetch course titles.");
      }
    }

    function filterTitles(query) {
      return allTitles.filter(t => t.toLowerCase().includes(query));
    }

    function displayCourse(course) {
      const output = document.getElementById('outputBox');
      output.innerHTML = `
        <div class="output-box">
          <div class="output-item"><div class="label"><i class="fas fa-book"></i>Course Title:</div><div class="value">${course.courseTitle || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-laptop-code"></i>Technical Requirements:</div><div class="value">${course.technical || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-tablet-alt"></i>Device Restrictions:</div><div class="value">${course.device || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-desktop"></i>Required Operating Systems:</div><div class="value">${course.os || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-download"></i>Software Downloads:</div><div class="value">${course.software || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-microchip"></i>Additional Hardware:</div><div class="value">${course.hardware || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-book-open"></i>Textbook / eText:</div><div class="value">${course.textbook || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-barcode"></i>ISBN:</div><div class="value">${course.isbn || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-dollar-sign"></i>Estimated Cost:</div><div class="value">${course.cost || "—"}</div></div>
          <div class="output-item"><div class="label"><i class="fas fa-coins"></i>Additional Costs:</div><div class="value">${course.additionalCosts || "—"}</div></div>
        </div>
      `;
    }

    async function loadCourse(title) {
      const res = await fetch(API_URL + "?course=" + encodeURIComponent(title));
      const data = await res.json();
      if (data && data.length > 0) {
        displayCourse(data[0]);
      } else {
        document.getElementById('outputBox').innerHTML = "<div class='no-results'>No data found for that course.</div>";
      }
    }

    document.getElementById('courseInput').addEventListener('input', () => {
      const query = document.getElementById('courseInput').value.toLowerCase().trim();
      const courseResults = document.getElementById('courseResults');
      courseResults.innerHTML = "";

      if (query.length < 2) return;

      const matches = filterTitles(query);
      matches.forEach(match => {
        const btn = document.createElement('button');
        btn.className = 'course-button';
        btn.textContent = match;
        btn.onclick = () => {
          document.getElementById('courseInput').value = match;
          loadCourse(match);
          courseResults.innerHTML = "";
        };
        courseResults.appendChild(btn);
      });
    });

    window.addEventListener('DOMContentLoaded', fetchTitles);
  </script>

</body>
</html>
